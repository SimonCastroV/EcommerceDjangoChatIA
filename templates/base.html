{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Mi E-commerce{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="logo"><a href="{% url 'products:product_list' %}">Mi Tienda</a></h1>
      <nav><a href="{% url 'chat:chat_ui' %}">Chat</a></nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container">© {{ timezone.now.year }} Mi E-commerce</div>
  </footer>
  {% block extra_js %}{% endblock %}
</body>
</html>
